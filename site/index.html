<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agora Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="hero-text">
        <h1>Agora Playground</h1>
        <p class="lead">A test page for Agora's coding workers. Every change here was asked for in an Agora room, built by a worker, reviewed, and confirmed.</p>
        <a class="cta" href="#changes-title">See the changes</a>
      </div>
    </section>
    <p id="greeting"></p>
    <h2 id="changes-title">Changes</h2>
    <ul id="changes"></ul>
  </main>
  <script type="module">
    import { greeting, changes, parallaxOffset } from "./app.js";
    document.getElementById("greeting").textContent = greeting("visitor");
    const list = document.getElementById("changes");
    const bg = document.querySelector(".hero-bg");
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      let waiting = false;
      const update = () => {
        waiting = false;
        bg.style.transform = `translateY(${parallaxOffset(window.scrollY)}px)`;
      };
      window.addEventListener("scroll", () => {
        if (!waiting) { waiting = true; requestAnimationFrame(update); }
      }, { passive: true });
      update();
    }
    for (const c of changes) {
      const li = document.createElement("li");
      li.textContent = c;
      list.append(li);
    }
  </script>
</body>
</html>
